<!DOCTYPE html>
<html>
<head>
	<title>Sundered</title>
	<base href="../">
	<link rel="shortcut icon" type="image/png" href="favicon.png">
	<div id="head-placeholder"></div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="js/script.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script>
		$(function() {
			$('#head-placeholder').load('navigation/head_content.html');
			$('#topbar').load('navigation/topbar.html');
			$('#sidebar').load('navigation/sidebar.html');
			$('#bottombar').load('navigation/bottombar.html');
			$('#novice-pane').load('magic/spells/novice_spells.html');
			$('#adept-pane').load('magic/spells/adept_spells.html');
			$('#expert-pane').load('magic/spells/expert_spells.html');
			$('#master-pane').load('magic/spells/master_spells.html');
		});

		window.addEventListener('load', () => {
		    filterSelection('sorcery')
		});
	</script>
</head>
<body>
<div class="container-fluid">
	<div class="row bg-red">
		<div class="col-12" id="topbar">
		</div>
	</div>
	<div class="row">
		<div class="col-lg-2 col-md-3 bg-dark">
			<nav class="navbar" id="sidebar">
			</nav>
		</div>
		<div class="col-lg-10 col-md-9 content">
			<h1>
				Spells
			</h1>

			<!-- Spell Level Navigation Tabs -->
			<ul class="nav nav-tabs" id="myTab" role="tablist">
			  <li class="nav-item" role="presentation">
			    <button class="nav-link active" id="novice" data-bs-toggle="tab" data-bs-target="#novice-pane" type="button" role="tab" aria-controls="novice-pane" aria-selected="true"><em>Novice</em></button>
			  </li>
			  <li class="nav-item" role="presentation">
			    <button class="nav-link" id="adept" data-bs-toggle="tab" data-bs-target="#adept-pane" type="button" role="tab" aria-controls="adept-pane" aria-selected="false"><em>Adept</em></button>
			  </li>
			  <li class="nav-item" role="presentation">
			    <button class="nav-link" id="expert" data-bs-toggle="tab" data-bs-target="#expert-pane" type="button" role="tab" aria-controls="expert-pane" aria-selected="false"><em>Expert</em></button>
			  </li>
			  <li class="nav-item" role="presentation">
			    <button class="nav-link" id="master" data-bs-toggle="tab" data-bs-target="#master-pane" type="button" role="tab" aria-controls="master-pane" aria-selected="false"><em>Master</em></button>
			  </li>
			</ul>

			<!-- Spell Tables -->
			<div class="tab-content" id="myTabContent">
			  <!-- Novice Spells -->
			  <div class="tab-pane active" id="novice-pane" role="tabpanel" aria-labelledby="novice" tabindex="0">
			  </div>

			  <!-- Adept Spells -->
			  <div class="tab-pane" id="adept-pane" role="tabpanel" aria-labelledby="adept" tabindex="0">
			  </div>

			  <!-- Expert Spells -->
			  <div class="tab-pane" id="expert-pane" role="tabpanel" aria-labelledby="expert" tabindex="0">
			  </div>

			  <!-- Master Spells -->
			  <div class="tab-pane" id="master-pane" role="tabpanel" aria-labelledby="master" tabindex="0">
			  </div>
			</div>

			<!-- Filter Buttons -->
			<div id="myBtnContainer">
				<div>
					<button class="btn sorcery active" onclick="filterSelection('sorcery')">Sorceries</button>
					<button class="btn miracle" onclick="filterSelection('miracle')">Miracles</button>
					<button class="btn invocation" onclick="filterSelection('invocation')">Invocations</button>
					<button class="btn hex" onclick="filterSelection('hex')">Hexes</button>
					<button class="btn mystery" onclick="filterSelection('mystery')">Mysteries</button>
					<button class="btn charm" onclick="filterSelection('charm')">Charms</button>
					<button class="btn manifestation" onclick="filterSelection('manifestation')">Manifestations</button>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-12" id="bottombar">
		</div>
	</div>
</div>
<script>
	function triggerExpand() {
		expandAndHighlight('Magic','Spells','magicToggle')
	}
</script>
</body>
<footer>
	<script type="text/javascript">
		const queryString = window.location.search;
		console.log(queryString)
		const urlParams = new URLSearchParams(queryString);
		console.log(urlParams)
		const param = urlParams.get('spellfilter')
		console.log(param)

		// Add active class to the current control button (highlight it)
		var btnContainer = document.getElementById("myBtnContainer");
		var btns = btnContainer.getElementsByClassName("btn");
		for (var i = 0; i < btns.length; i++) {
		  btns[i].addEventListener("click", function() {
		    var current = btnContainer.getElementsByClassName("active");
		    current[0].className = current[0].className.replace(" active", "");
		    this.className += " active";
		  });
		}
	</script>
</footer>
</html>
